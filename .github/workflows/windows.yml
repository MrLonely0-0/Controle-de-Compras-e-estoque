name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL HTTPS da operação (opcional; vazio solicita a URL no primeiro uso)"
        type: string
        required: false
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
        env:
          ESTOQUE_URL: ${{ inputs.server_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: Estoque-e-Compras-Windows
          path: release/*.exe
          if-no-files-found: error
