appId: br.com.nordeschina.estoque
productName: Estoque e Compras
asar: true
npmRebuild: false
directories:
  output: release
files:
  - desktop/**/*
  - "!node_modules/**/*"
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  uninstallUrlHelp: https://github.com/MrLonely0-0
  uninstallUrlInfoAbout: https://github.com/MrLonely0-0
  uninstallUrlUpdateInfo: https://github.com/MrLonely0-0
extraResources:
  - from: .data/desktop.json
    to: desktop.json
